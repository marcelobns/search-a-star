<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Demo da implementação do algoritmo de busca A* no mapa rodoviário da Romênia">
        <title>A* Search</title>
        <link rel="stylesheet" href="css/font-awesome.min.css">
        <link rel="stylesheet" href="css/default.css">
    </head>
    <body>
        <div class="app">
            <aside class="panel" id="panel">
                <header class="panel-header">
                    <div class="brand">
                        <span class="brand-mark" aria-hidden="true">A*</span>
                        <div>
                            <h1>A* Search</h1>
                            <p>Rota de menor custo no mapa da Romênia</p>
                        </div>
                    </div>
                    <button type="button" class="panel-toggle" id="panel-toggle" aria-expanded="true" aria-controls="panel-body" aria-label="Recolher painel de rotas">
                        <i class="fa fa-chevron-up" aria-hidden="true"></i>
                    </button>
                </header>
                <button type="button" class="panel-summary" id="panel-summary" aria-label="Expandir painel de rotas"></button>

                <div class="panel-body" id="panel-body">
                    <div class="route-form">
                        <div class="field">
                            <label for="origin"><span class="dot dot-origin" aria-hidden="true"></span> Origem</label>
                            <select id="origin"></select>
                        </div>
                        <div class="field">
                            <label for="destiny"><span class="dot dot-destiny" aria-hidden="true"></span> Destino</label>
                            <select id="destiny"></select>
                        </div>
                        <button type="button" class="swap" id="swap" title="Inverter origem e destino" aria-label="Inverter origem e destino">
                            <i class="fa fa-exchange fa-rotate-90" aria-hidden="true"></i>
                        </button>
                    </div>
                    <p class="hint"><i class="fa fa-hand-pointer-o" aria-hidden="true"></i> Clique numa cidade do mapa para defini-la como destino.</p>

                    <section class="result" id="result" aria-live="polite"></section>
                </div>

                <footer class="panel-footer">
                    <a href="https://github.com/marcelobns/search-a-star" target="_blank" rel="noopener"><i class="fa fa-github" aria-hidden="true"></i> Código e documentação</a>
                </footer>
            </aside>

            <main class="map">
                <div class="canvas">
                    <canvas id="map" role="img" aria-label="Mapa da Romênia com as cidades e estradas">
                        Seu navegador não suporta HTML5 canvas
                    </canvas>
                </div>
            </main>
        </div>
        <script src="js/assets.js"></script>
        <script src="js/canvas.js"></script>
        <script src="js/a-star.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
